<style>
:root{--green:#059669;--ink:#172033;--muted:#94a3b8;--line:#e7edf1}

.fm{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px}

.crow{display:grid;grid-template-columns:200px 1fr 90px;gap:12px;align-items:center;padding:8px 17px}
.crow .n{font-size:11px;font-weight:700;color:#334155}.bar{height:7px;border-radius:99px;background:#f1f5f9;display:flex;overflow:hidden}

.ps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}.ps .card{text-align:center;padding:14px}.ps span{color:var(--muted);font-size:10px}.ps b{display:block;font-size:23px;margin-top:4px}
.go{width:100%;border:0;border-radius:12px;padding:13px;background:#10b981;color:#fff;font-weight:700;cursor:pointer;margin:6px 0 12px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 17px}

.tag{font-size:9px;font-weight:700;background:#ecfdf5;color:#047857;border-radius:99px;padding:2px 8px;margin-left:5px}
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(#10b981 var(--p),#e8eef0 0)}
.ring span{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:10px;font-weight:800;color:#047857}
.hab{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid #e9eef1;border-radius:11px;margin:9px 17px;background:#fcfdfd;cursor:pointer}
.hab input{width:18px;height:18px;accent-color:#059669}.hab b{font-size:12px;color:#334155}.hab small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.pad{padding:0 0 10px}.empty{padding:32px;text-align:center;color:var(--muted);font-size:12px}
.sk{height:90px;border-radius:16px;margin-bottom:12px;background:linear-gradient(90deg,#f1f5f9 25%,#e8eef2 37%,#f1f5f9 63%);background-size:400% 100%;animation:p 1.4s infinite}@keyframes p{to{background-position:0 50%}}
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lc{width:min(430px,100%);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 18px 45px rgba(15,23,42,.08);text-align:center}
.lc h1{margin:12px 0 0;font-size:23px;font-weight:800}.lc p{color:var(--muted);font-size:11px;line-height:1.6;margin:7px 0 18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:#f8fafc;border:1px solid #edf1f4;border-radius:11px;margin-bottom:16px}
.tabs button{border:0;background:none;padding:9px;border-radius:8px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}.tabs .on{background:#fff;color:#047857;box-shadow:0 1px 4px rgba(15,23,42,.08)}
.lc label{display:block;text-align:left;font-size:11px;font-weight:700;margin:10px 0 5px;color:#334155}
.lc input,.lc select{width:100%;border:1px solid #dfe5e9;border-radius:10px;padding:11px;font-size:14px}
.pb{width:100%;margin-top:16px;border:0;border-radius:10px;padding:12px;background:#10b981;color:#fff;font-weight:700;cursor:pointer}.pb:disabled{opacity:.6}
.gb{width:100%;border:1px solid #dfe5e9;background:#fff;border-radius:10px;padding:12px;font-weight:700;color:#334155;cursor:pointer}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#172033;color:#fff;padding:11px 18px;border-radius:99px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center;z-index:99}
#toast.show{opacity:1}#toast.err{background:#b91c1c}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.cg{grid-template-columns:1fr}.crow{grid-template-columns:1fr;gap:4px}.crow .c{text-align:left}}
@media(max-width:720px){.layout{display:block}.sidebar{border:0;border-bottom:1px solid var(--line);padding:8px;display:flex;overflow-x:auto}.nav{white-space:nowrap;width:auto;font-size:12px}.main{padding:18px 14px}.fm{grid-template-columns:1fr}}

          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.85z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Masuk dengan Google</button>
      </div>
      <form id="pB" hidden onsubmit="loginBK(event)">
        <label for="fT">Tingkat Kepengurusan</label>
        <select id="fT"><option value="Kelompok">BK Kelompok</option><option value="Desa">BK Desa</option><option value="Daerah">BK Daerah</option></select>
        <label for="fU">Username</label><input id="fU" autocomplete="username" autocapitalize="none" placeholder="Masukkan username" required>
        <label for="fP">Kata Sandi</label><input id="fP" type="password" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
        <button class="pb" id="fB">Masuk Dashboard BK</button>
      </form>
    </div>
    <p class="muted" style="text-align:center;margin-top:16px;font-size:11px">&copy; 2026 Jurnal 29 Karakter Luhur</p>
  </div>
</section>

<header id="top" class="topbar" hidden>
  <div class="brand"><div class="mark">&#128150;</div><div><b>Jurnal 29 Karakter</b><small id="sub"></small></div></div>
  <div class="who"><span id="nm"></span><button class="btn-out" onclick="keluar()">Keluar</button></div>
</header>
<div id="app" class="layout" hidden>
  <aside class="sidebar"><nav id="nav" style="display:contents"></nav></aside>
  <main class="main"><div class="content" id="isi"></div></main>
</div>
<nav id="bt" hidden><button data-t="hari" onclick="otab('hari')">&#9989; Hari ini</button><button data-t="karakter" onclick="otab('karakter')">&#127775; Karakter</button></nav>
<div id="toast"></div>

<script>
// ============ KONFIGURASI (satu-satunya tempat yang perlu Anda ganti) ============
const API_URL = "https://script.google.com/macros/s/AKfycbxLgd2LmuYFvCYLI6ApCrgfUQOuEaPQnqpa-QJT192OFbkwOPrZlxh7CZui6ZI9N7o25Q/exec";            // URL /exec dari Deploy > Web app
const URL_IDENTITAS = "https://script.google.com/macros/s/AKfycbzpw_ac9ydrcSOB_VUKEYclP9BadV2LpOVeZFWhARHU_BO8PtDxTq5Wp25wsUQ9PSwY/exec";
const URL_APP_LAMA = "https://script.google.com/macros/s/AKfycbwy5K3O-NjHOtCYZ0dtRNNSew2TkrtdSDnxXN_jrQdepv1oBT2Hq2mJyYSIU1oQE6lz/exec";                                     // opsional: URL aplikasi Apps Script lama (untuk fitur yang belum dipindah)

// ============ HELPER ============
const $ = id => document.getElementById(id);
const S = { token: null, role: null, anakId: null };
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = v => v == null ? '&ndash;' : v + '%';
const kecil = v => v === -1 ? '&lt; 3' : (v == null ? '&ndash;' : v);
let tm;
function toast(m, e) { const t = $('toast'); t.textContent = m; t.className = 'show' + (e ? ' err' : ''); clearTimeout(tm); tm = setTimeout(() => t.className = '', 3000); }
const skel = n => '<div class="sk"></div>'.repeat(n || 3);

async function post(body) {
  let r;
  try { r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) }); }
  catch (e) { throw new Error('Tidak bisa terhubung ke server. Periksa internet dan API_URL.'); }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('Balasan server bukan JSON. Pastikan deployment Web app: Anyone.'); }
  if (!j.success) throw new Error(j.error);
  return j.data;
}
function apiCall(fn, ...args) {
  return post({ action: 'call', token: S.token, fn: fn, args: args }).catch(e => {
    if (/SESI_HABIS/.test(e.message)) { keluar(true); toast('Sesi berakhir, silakan masuk lagi.', true); }
    throw e;
  });
}
function galat(el, e) { el.innerHTML = '<div class="card empty">' + esc(e.message) + '</div>'; }

// ============ LOGIN ============
function tab(r) {
  $('tO').classList.toggle('on', r === 'ortu'); $('tB').classList.toggle('on', r === 'bk');
  $('pO').hidden = r !== 'ortu'; $('pB').hidden = r !== 'bk';
}
async function loginBK(e) {
  e.preventDefault();
  const b = $('fB'); b.disabled = true; b.textContent = 'Memverifikasi...';
  try {
    const info = await post({ action: 'loginBK', data: { tingkat: $('fT').value, username: $('fU').value.trim(), password: $('fP').value } });
    $('fP').value = ''; mulai(info);
  } catch (err) { toast(err.message, true); }
  b.disabled = false; b.textContent = 'Masuk Dashboard BK';
}
function mulai(info) {
  S.token = info.token; S.role = info.role;
  try { sessionStorage.setItem('j29', info.token); } catch (e) {}
  $('login').hidden = true; $('top').hidden = false; $('app').hidden = false;
  const o = S.role.tipe === 'ortu'; document.body.classList.toggle('ortu', o); $('top').hidden = o; $('bt').hidden = true;
  if (S.role.tipe === 'ortu') { $('sub').textContent = 'Orang Tua'; $('nm').textContent = ''; $('nav').innerHTML = ''; $('app').style.display = 'block'; $('isi').parentElement.style.padding = '20px 14px 96px'; $('nav').parentElement.hidden = true; ortu(); }
  else { $('app').style.display = ''; $('nav').parentElement.hidden = false; $('isi').parentElement.style.padding = ''; bk(); }
}
async function keluar(diam) {
  if (!diam && S.token) { try { await post({ action: 'call', token: S.token, fn: 'keluar', args: [] }); } catch (e) {} }
  try { sessionStorage.removeItem('j29'); } catch (e) {}
  S.token = null; document.body.classList.remove('ortu'); $('bt').hidden = true; $('top').hidden = true; $('app').hidden = true; $('login').hidden = false;
}

// ============ BK ============
const MENU = { daerah: ['Ringkasan', 'Percakapan', 'Apresiasi', 'Jadwal fokus', 'Wilayah', 'Cetak', 'Akun'],
  desa: ['Ringkasan', 'Apresiasi', '+ Kelompok', 'Cetak', 'Akun'],
  kelompok: ['Pengesahan', 'Tindak lanjut', 'Apresiasi', 'Ringkasan', '+ Keluarga', 'Akun'] };
function bk() {
  const p = S.role.peran;
  $('sub').textContent = 'BK ' + p.charAt(0).toUpperCase() + p.slice(1); $('nm').textContent = S.role.nama;
  $('nav').innerHTML = (MENU[p] || []).map((m, i) => '<button class="nav' + (i === 0 ? ' on' : '') + '" onclick="menu(this,' + i + ')">' + esc(m) + '</button>').join('');
  menu($('nav').firstChild, 0);
}
function menu(el, i) {
  document.querySelectorAll('.nav').forEach(n => n.classList.remove('on')); el.classList.add('on');
  const p = S.role.peran, nama = MENU[p][i];
  B.kel = null;
  const kp = p === 'kelompok', M = { Pengesahan: pengesahan, 'Tindak lanjut': tindak, Apresiasi: kp ? aprK : null, Ringkasan: kp ? ringK : () => ringkasan(''), '+ Keluarga': keluarga, Akun: akun };
  if (M[nama]) return M[nama]();
  $('isi').innerHTML = '<div class="card empty"><b>' + esc(nama) + '</b><br><br>Fitur ini belum dipindahkan ke versi baru.' +
    (URL_APP_LAMA ? '<br><a href="' + esc(URL_APP_LAMA) + '">Buka aplikasi lama</a>' : '') + '</div>';
}
async function ringkasan(bulan) {
  const el = $('isi'); el.innerHTML = skel(4);
  try {
    const d = await apiCall('getRingkasanWilayah', bulan), t = d.total, tl = d.totalLalu, dr = S.role.peran === 'daerah';
    const stat = (l, v, m) => '<div class="card stat"><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="m">' + (m || '') + '</div></div>';
    const opsi = (d.bulanTersedia.length ? d.bulanTersedia : [d.bulan]).map(b => '<option' + (b === d.bulan ? ' selected' : '') + '>' + esc(b) + '</option>').join('');
    const warn = (!d.ada.partisipasi || !d.ada.karakter) ? '<div class="card empty" style="margin-bottom:14px">Data rekap bulan ' + esc(d.bulan) + ' belum lengkap. Rekap dihitung otomatis tiap malam.</div>' : '';
    const fokus = d.fokus.karakterNama
      ? '<div class="focus"><span class="k">Fokus ' + esc(d.bulan) + '</span><h3>' + esc(d.fokus.karakterNama) + '</h3><p>berdampingan dengan 3 Karakter Sukses</p><div class="fm">' +
        '<div><b>' + pct(t.fokusCakupan) + '</b><small>Cakupan: anak punya praktek fokus</small></div>' +
        '<div><b>' + pct(t.fokusKeaktifan) + '</b><small>Keaktifan: mencatat 7 hari terakhir</small></div>' +
        '<div><b>' + pct(t.fokusKehadiran) + '</b><small>Kehadiran: hari tercatat dari hari berlalu</small></div></div></div>'
      : '<div class="card empty" style="margin-bottom:14px">Belum ada jadwal fokus untuk bulan ini.</div>';
    const baris = d.unit.map(u => '<tr><td>' + esc(u.unitNama) + '</td><td>' + u.keluarga + '</td><td>' + u.anak + '</td><td>' + u.punyaPraktek + '</td><td>' + u.aktif7 + '</td><td>' + u.aktif30 + '</td><td>' + u.antrian + '</td></tr>').join('');
    let kar = '';
    d.kategori.forEach(k => {
      kar += '<div class="kat">' + esc(k.label) + '</div>';
      k.karakter.forEach(c => {
        const tot = c.tetap + c.berjalan + c.menunggu || 1;
        kar += '<div class="crow"><div class="n">' + esc(c.nama) + (c.wajibSelalu ? '<span class="tag">selalu</span>' : '') + '</div><div class="bar"><i style="width:' + c.tetap * 100 / tot + '%"></i><i style="width:' + c.menunggu * 100 / tot + '%"></i><i style="width:' + c.berjalan * 100 / tot + '%"></i></div><div class="c">' + c.tetap + ' tetap</div></div>';
      });
    });
    el.innerHTML = warn + '<div class="head"><div><h2 class="t">Ringkasan ' + (dr ? 'Daerah' : 'Desa') + '</h2><p class="d">Angka saja, tanpa nama anak. Bukan peringkat: daftar diurutkan menurut nama.' + (dr ? ' Rincian halus memakai &ldquo;&lt; 3&rdquo;.' : '') + '</p></div><select class="sel" id="bln">' + opsi + '</select></div>' +
      '<div class="stats">' + stat('Keluarga', t.keluarga) + stat('Anak', t.anak, tl.anak ? 'bulan lalu ' + tl.anak : '') + stat('Sudah punya praktek', pct(t.persenPraktek)) + stat('Mencatat 7 hari', pct(t.persenAktif7)) +
      stat('Mencatat 30 hari', pct(t.persenAktif30)) + stat('Menunggu sah', t.antrian) + stat('Antrian tertua', t.antrianTertua + ' hari') + stat('Praktek kustom', t.kustom) + '</div>' + fokus +
      '<section class="card sec"><div class="sh"><h3>Partisipasi per ' + esc(d.unitLabel) + '</h3><p>Diurutkan menurut nama, bukan peringkat.</p></div><div class="tw"><table><thead><tr><th>' + esc(d.unitLabel) + '</th><th>Keluarga</th><th>Anak</th><th>Punya praktek</th><th>Mencatat 7 hr</th><th>Mencatat 30 hr</th><th>Menunggu sah</th></tr></thead><tbody>' + baris + '</tbody></table></div></section>' +
      '<section class="card sec"><div class="sh"><h3>29 Karakter Luhur</h3><p>Jumlah anak per status: Kebiasaan Tetap (hijau), Menunggu (kuning), Berjalan (biru). Satu anak bisa terhitung di beberapa karakter.</p></div><div class="pad">' + kar + '</div></section>';
    $('bln').onchange = function () { ringkasan(this.value); };
  } catch (e) { galat(el, e); }
}

// ============ ORANG TUA (4 karakter: 3 Sukses + 1 fokus bulan ini) ============
const O = { tab: 'hari', tgl: '', n: 0, dash: null, nama: {}, k: null, tersedia: [] };
const LBL = ['Hari ini', 'Kemarin', '2 hari lalu', '3 hari lalu'];
const ST = { Berjalan: ['Berjalan', ''], Diusulkan: ['Menunggu pengesahan', 'w'], KebiasaanTetap: ['Kebiasaan tetap', 'g'] };
function tglStr(n) { const d = new Date(); d.setDate(d.getDate() - n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const gagal = e => toast(e.message, true);

async function ortu() {
  const el = $('isi'); el.innerHTML = skel(3);
  try {
    const [info, anak] = await Promise.all([apiCall('getInfoKeluarga'), apiCall('getAnakList')]);
    if (!anak.length) { el.innerHTML = '<div class="card empty">Belum ada anak terdaftar. Hubungi BK Kelompok Anda.</div>'; return; }
    anak.forEach(a => O.nama[a.id] = a.nama); S.anakId = S.anakId || anak[0].id;
    el.innerHTML = '<div class="ow"><div class="oh"><div><small>Halo,</small><h2>' + esc(info.namaKepala) + '</h2></div><button class="ko" onclick="keluar()">Keluar</button></div>' +
      '<select id="pa" class="pa">' + anak.map(a => '<option value="' + esc(a.id) + '"' + (a.id === S.anakId ? ' selected' : '') + '>' + esc(a.nama) + '</option>').join('') + '</select><div id="ia"></div></div>';
    $('pa').onchange = function () { S.anakId = this.value; O.dash = null; otab(O.tab); };
    $('bt').hidden = false; otab('hari');
  } catch (e) { galat(el, e); }
}
function otab(t) {
  O.tab = t; document.querySelectorAll('#bt button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  if (t === 'hari') hari(); else karakter();
}
function perayaan(j, s) {
  $('ia').insertAdjacentHTML('afterbegin', '<div class="card pera"><b>' + esc(j) + '</b><p>' + esc(s) + '</p><button class="go" onclick="this.parentElement.remove()">Lanjut</button></div>');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ---------- TAB: HARI INI ----------
async function hari(diam) {
  const el = $('ia'); if (!diam) el.innerHTML = '<div style="margin-top:14px">' + skel(3) + '</div>';
  try {
    const [d, cl] = await Promise.all([apiCall('getDashboardAnak', S.anakId), apiCall('getChecklistHariIni', S.anakId, O.tgl)]);
    O.dash = d; const rb = d.ringkasanBulanan, st = d.streakHarian;
    const sudah = i => i.caraHariIni === 'Mandiri' || i.caraHariIni === 'Diingatkan';
    const item = i => '<label class="hab"><input type="checkbox"' + (sudah(i) ? ' checked' : '') + ' onchange="centang(\'' + esc(i.catatanId) + '\',this)"><div><b>' + esc(i.praktekNama) + '</b></div></label>';
    const adaHariIni = O.n === 0 && cl.some(sudah);
    const kalimat = st > 0 ? 'Streak ' + st + ' hari. ' + (adaHariIni ? 'Hari ini sudah tercatat, bagus!' : 'Catat hari ini supaya jadi ' + (st + 1) + '.') : 'Mulai streak baru: catat satu praktek hari ini.';
    const nama4 = new Set(d.disorot.map(k => k.nama));
    const grup = d.disorot.map(k => {
      const it = cl.filter(i => i.karakterNama === k.nama);
      return '<div class="gh"><span class="gn">' + esc(k.nama) + (k.isFokusBulan ? ' <em>Fokus bulan ini</em>' : '') + '</span><span>' + it.filter(sudah).length + '/' + it.length + '</span></div>' +
        (it.length ? it.map(item).join('') : '<p class="d" style="margin:4px 2px">Belum ada praktek. Pilih di tab Karakter.</p>');
    }).join('');
    const lain = cl.filter(i => !nama4.has(i.karakterNama));
    el.innerHTML = '<div class="card sc"><b>&#128293; ' + st + ' hari</b><p>' + esc(kalimat) + '</p><small>Rekor ' + d.rekorStreak + ' hari &middot; Minggu ini ' + d.progresMinggu.hariTercatat + '/' + d.progresMinggu.totalHari + ' &middot; Bulan ini ' + rb.hariTercatat + ' dari ' + rb.hariBerjalan + ' hari</small></div>' +
      '<p class="d" style="margin:14px 2px 6px">Mencatat untuk:</p><div class="chips">' + LBL.map((l, n) => '<button class="' + (n === O.n ? 'on' : '') + '" onclick="pilihTgl(' + n + ')">' + l + '</button>').join('') + '</div>' + grup +
      (lain.length ? '<details class="card dt"><summary>Lanjutan dari bulan sebelumnya (' + lain.length + ')</summary>' + lain.map(item).join('') + '</details>' : '');
  } catch (e) { galat(el, e); }
}
function pilihTgl(n) { O.n = n; O.tgl = n === 0 ? '' : tglStr(n); hari(); }
async function centang(id, cb) {
  cb.disabled = true; const ya = cb.checked;
  try {
    const h = await apiCall('catatHarian', id, ya ? 'Mandiri' : 'BelumDilakukan', O.tgl);
    toast(ya ? 'Ditandai selesai (Mandiri)' : 'Ditandai belum dilakukan');
    await hari(true);
    if (h && h.milestone) perayaan(h.milestone + ' hari beruntun!', 'Terus jaga kebiasaan baiknya.');
    else if (h && h.rekorBaru) perayaan('Rekor baru: ' + h.rekorStreak + ' hari!', 'Rekor streak terpanjang sejauh ini.');
  } catch (e) { cb.checked = !ya; cb.disabled = false; gagal(e); }
}

// ---------- TAB: KARAKTER (hanya 4) ----------
async function karakter() {
  const el = $('ia');
  try {
    if (!O.dash) { el.innerHTML = '<div style="margin-top:14px">' + skel(3) + '</div>'; O.dash = await apiCall('getDashboardAnak', S.anakId); }
    el.innerHTML = '<p class="d" style="margin:14px 2px 8px">Empat karakter yang dijalani sekarang: 3 Karakter Sukses dan 1 karakter fokus bulan ini. Ketuk untuk melihat progres atau memilih praktek.</p>' +
      O.dash.disorot.map((k, i) => {
        const p = k.jumlahBerjalan ? Math.round((k.sudahHariIni || 0) * 100 / k.jumlahBerjalan) : 0, c = k.isFokusBulan ? '#fbbf24' : '#34d399';
        const t = !k.jumlahBerjalan ? 'Belum ada praktek dipilih' : (k.sudahHariIni >= k.jumlahBerjalan ? 'Hari ini: semua sudah dicatat &#10003;' : 'Hari ini: ' + k.sudahHariIni + ' dari ' + k.jumlahBerjalan + ' sudah dicatat');
        return '<div class="card kc" style="cursor:pointer" onclick="detail(' + i + ')"><div><b>' + esc(k.nama) + '</b>' + (k.isFokusBulan ? '<span class="tag">Fokus bulan ini</span>' : '<span class="tag">Sukses</span>') + '<p>' + t + (k.jumlahTetap ? ' &middot; ' + k.jumlahTetap + ' kebiasaan tetap' : '') + '</p></div>' +
          '<div class="ring" style="--p:' + p + '%;--t:' + c + '"><span>' + (k.jumlahBerjalan ? p + '%' : '+') + '</span></div></div>';
      }).join('') + '<button class="lk" onclick="lanjutan()">Atur praktek dari bulan sebelumnya</button>';
  } catch (e) { galat(el, e); }
}
function detail(i) { O.k = O.dash.disorot[i]; return detailK(); }
async function detailK() {
  const el = $('ia'), k = O.k; el.innerHTML = '<div style="margin-top:14px">' + skel(2) + '</div>'; O.dash = null;
  try {
    const [list, ts] = await Promise.all([apiCall('getDetailPraktekKarakter', S.anakId, k.karakterId), apiCall('getPraktekTersedia', S.anakId, k.karakterId).catch(() => null)]);
    const tersedia = ts || [];
    O.tersedia = tersedia;
    const bar = (l, v, a) => '<div class="pl"><span>' + l + '</span><span>' + v + '/' + a + '</span></div><div class="pbar"><i style="width:' + Math.min(100, v * 100 / (a || 1)) + '%"></i></div>';
    const pk = p => { const s = ST[p.status] || [p.status, '']; const aj = (j, b) => b ? '<button class="go" onclick="ajukan(\'' + esc(p.catatanId) + '\',\'' + j + '\')">Ajukan sebagai kebiasaan (jalur ' + j + ')</button>' : '';
      return '<div class="card pc"><div class="pr"><b>' + esc(p.praktekNama) + '</b><span class="st ' + s[1] + '">' + s[0] + '</span></div>' + (p.alasanPenolakan ? '<p class="al">Catatan BK: ' + esc(p.alasanPenolakan) + '</p>' : '') +
        bar('Mandiri', p.jumlahMandiri, p.ambang) + aj('Mandiri', p.bisaDiajukanMandiri) + bar('Diingatkan', p.jumlahDiingatkan, p.ambang) + aj('Diingatkan', p.bisaDiajukanDiingatkan) +
        '<p class="d" style="margin:10px 0 4px">14 hari terakhir</p><div class="hm">' + (p.heatmap14Hari || []).map(h => '<i class="' + (h.cara === 'Mandiri' ? 'm' : h.cara === 'Diingatkan' ? 'g2' : '') + '" title="' + esc(h.tanggal) + '"></i>').join('') + '</div></div>'; };
    el.innerHTML = '<button class="bk0" onclick="otab(\'karakter\')">&#8249; ' + esc(k.nama) + '</button>' +
      (list.length ? list.map(pk).join('') : '<p class="d" style="margin:10px 2px">Belum ada praktek untuk karakter ini. Pilih dari daftar di bawah, atau tambahkan sendiri.</p>') +
      '<div id="bw"><p class="d" style="margin:16px 2px 6px">Praktek lain yang bisa dipilih</p>' +
      (tersedia.length ? '<div class="card" style="padding:4px 14px">' + tersedia.map((p, n) => '<div class="tr"><div><b>' + esc(p.nama) + '</b>' + (p.deskripsi ? '<small>' + esc(p.deskripsi) + '</small>' : '') + '</div><button class="mb" onclick="mulaiP(' + n + ')">+ Mulai</button></div>').join('') + '</div>' : '<p class="d" style="margin:4px 2px">Semua praktek referensi sudah dijalani.</p>') +
      '<button class="lk" onclick="$(\'fk2\').hidden=!$(\'fk2\').hidden">+ Tambah praktek sendiri</button>' +
      '<div id="fk2" class="card" hidden style="padding:14px"><input id="kn" placeholder="Nama praktek, mis. Merapikan mainan sendiri"><input id="kd" placeholder="Catatan (opsional)"><button class="go" onclick="tambahK()">Tambahkan &amp; mulai</button></div></div>';
    if (!ts) { const b = $('bw'); if (b) b.remove(); }
  } catch (e) { galat(el, e); }
}
async function lanjutan() {
  const el = $('ia'); el.innerHTML = '<div style="margin-top:14px">' + skel(2) + '</div>';
  try {
    const list = await apiCall('getPraktekLanjutan', S.anakId), g = {};
    list.forEach(p => { (g[p.karakterId] = g[p.karakterId] || { karakterId: p.karakterId, nama: p.karakterNama, it: [] }).it.push(p); });
    O.gs = Object.keys(g).map(id => g[id]);
    el.innerHTML = '<button class="bk0" onclick="otab(\'karakter\')">&#8249; Praktek dari bulan sebelumnya</button>' +
      '<p class="d" style="margin:6px 2px 10px">Pilih: dilanjutkan di checklist, atau disembunyikan. Yang disembunyikan tetap tersimpan dan muncul lagi otomatis saat karakternya menjadi fokus bulanan.</p>' +
      (O.gs.length ? O.gs.map((x, n) => '<div class="gh"><span class="gn">' + esc(x.nama) + '</span><button class="mb" onclick="lihatKar(' + n + ')">Lihat progres</button></div>' +
        x.it.map(p => '<label class="hab"><input type="checkbox"' + (p.disembunyikan ? '' : ' checked') + ' onchange="lanjutP(\'' + esc(p.catatanId) + '\',this)"><div><b>' + esc(p.praktekNama) + '</b><small>' + (p.disembunyikan ? 'Disembunyikan' : 'Dilanjutkan') + '</small></div></label>').join('')).join('')
        : '<div class="card empty">Tidak ada praktek dari karakter bulan sebelumnya.</div>');
  } catch (e) { galat(el, e); }
}
function lihatKar(n) { O.k = { karakterId: O.gs[n].karakterId, nama: O.gs[n].nama }; detailK(); }
async function lanjutP(id, cb) {
  cb.disabled = true;
  try { await apiCall('aturLanjutPraktek', id, cb.checked); cb.parentElement.querySelector('small').textContent = cb.checked ? 'Dilanjutkan' : 'Disembunyikan'; toast(cb.checked ? 'Dilanjutkan di checklist' : 'Disembunyikan, tetap tersimpan'); }
  catch (e) { cb.checked = !cb.checked; gagal(e); }
  cb.disabled = false;
}
async function mulaiP(n) {
  const p = O.tersedia[n];
  try { await apiCall('aktifkanPraktek', S.anakId, p.praktekId, O.k.karakterId, p.sumber); await detailK(); toast('"' + p.nama + '" mulai dijalani'); } catch (e) { gagal(e); }
}
async function tambahK() {
  const n = $('kn').value.trim(); if (!n) return toast('Nama praktek wajib diisi.', true);
  try { await apiCall('tambahPraktekKustom', S.anakId, O.k.karakterId, n, $('kd').value.trim()); await detailK(); toast('Praktek ditambahkan & mulai dijalani'); } catch (e) { gagal(e); }
}
async function ajukan(id, jalur) {
  try { await apiCall('ajukanKebiasaan', id, jalur); await detailK(); perayaan('Kebiasaan baru!', 'Diajukan lewat jalur ' + jalur + ', menunggu pengesahan BK Kelompok.'); } catch (e) { gagal(e); }
}

// ============ BK KELOMPOK ============
const B = { ant: [], tl: [], apr: null, kel: null };
const kon = (b, t) => { if (b.dataset.k === '1') { b.dataset.k = '0'; return true; } b.dataset.k = '1'; b.dataset.a = b.textContent; b.textContent = t; setTimeout(() => { if (b.isConnected && b.dataset.k === '1') { b.dataset.k = '0'; b.textContent = b.dataset.a; } }, 3500); return false; };
const kepala = (j, p) => '<div class="head"><div><h2 class="t" style="font-size:20px">' + j + '</h2><p class="d">' + p + '</p></div></div>';

// ---- Pengesahan ----
async function pengesahan() {
  const el = $('isi'); el.innerHTML = skel(2);
  try { B.ant = await apiCall('getAntrianPengesahan'); gAnt(); } catch (e) { galat(el, e); }
}
function gAnt() {
  const el = $('isi'), tot = B.ant.reduce((n, a) => n + a.items.length, 0);
  if (!tot) { el.innerHTML = '<div class="card empty">Tidak ada usulan yang menunggu pengesahan.<br>Semua sudah ditinjau.</div>'; return; }
  el.innerHTML = kepala('Pengesahan', B.ant.length + ' anak &middot; ' + tot + ' praktek karakter menunggu tinjauan') + B.ant.map((a, ai) =>
    '<section class="card sec"><div class="sh" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>' + esc(a.namaAnak) + '</h3>' + (a.items.length > 1 ? '<div class="ba"><button class="p" onclick="semua(' + ai + ',this)">Sahkan semua (' + a.items.length + ')</button></div>' : '') + '</div>' +
    a.items.map((it, ii) => '<div class="bi" id="it' + ai + '_' + ii + '"><div><b>' + esc(it.praktekNama) + '</b><span class="bg ' + (it.jalurTercapai === 'Mandiri' ? '' : 'w') + '">Jalur ' + esc(it.jalurTercapai) + '</span></div><div class="ba"><button class="p" onclick="sahK(' + ai + ',' + ii + ',true,\'\',this)">&#10003; Sahkan</button><button class="x" onclick="tolakF(' + ai + ',' + ii + ')">Kembalikan</button></div></div>').join('') + '</section>').join('');
}
function tolakF(ai, ii) {
  const r = $('it' + ai + '_' + ii), it = B.ant[ai].items[ii], id = 'al' + ai + '_' + ii; r.style.display = 'block';
  r.innerHTML = '<p style="font-size:12px;margin:0 0 8px">Kembalikan &ldquo;' + esc(it.praktekNama) + '&rdquo; ke Berjalan?</p><div class="fl"><input id="' + id + '" maxlength="200" placeholder="Alasan untuk orang tua (opsional)"></div><div class="ba"><button class="x" onclick="sahK(' + ai + ',' + ii + ',false,$(\'' + id + '\').value.trim(),this)">Ya, kembalikan</button><button onclick="gAnt()">Batal</button></div>';
}
async function sahK(ai, ii, ya, alasan, b) {
  const a = B.ant[ai], it = a.items[ii]; b.disabled = true;
  try { await apiCall('sahkanKebiasaan', it.catatanId, ya, alasan); a.items.splice(ii, 1); if (!a.items.length) B.ant.splice(ai, 1); toast(ya ? 'Disahkan sebagai kebiasaan tetap' : 'Dikembalikan ke status berjalan'); gAnt(); } catch (e) { b.disabled = false; gagal(e); }
}
async function semua(ai, b) {
  if (!kon(b, 'Ketuk lagi untuk sahkan')) return; const a = B.ant[ai]; b.disabled = true;
  try { const h = await apiCall('sahkanBanyak', a.items.map(i => i.catatanId), true); B.ant.splice(ai, 1); toast(h.jumlahDiproses + ' praktek karakter disahkan'); gAnt(); } catch (e) { b.disabled = false; gagal(e); }
}

// ---- Tindak lanjut ----
const JN = { BelumMencatat: ['Belum mencatat', 'w'], FokusBelumTetap: ['Praktek fokus bulan lalu', ''], CekBerkala: ['Cek berkala', ''] };
async function tindak() {
  const el = $('isi'); el.innerHTML = skel(2);
  try { B.tl = (await apiCall('getTindakLanjut')).items || []; gTl(); } catch (e) { galat(el, e); }
}
function aksiTl(it, i) {
  return (it.jenis === 'FokusBelumTetap' ? '<button class="p" onclick="tlA(' + i + ',\'kebiasaan\',this)">Sudah jadi kebiasaan</button>' : '') +
    (it.jenis === 'CekBerkala' ? '<button class="p" onclick="tlA(' + i + ',\'terjaga\',this)">Masih terjaga</button><button onclick="tlA(' + i + ',\'kembali\',this)">Kembali ke berjalan</button>' : '') +
    '<button onclick="tlA(' + i + ',\'hubungi\',this)">Sudah dihubungi</button>';
}
function gTl() {
  const el = $('isi'); if (!B.tl.length) { el.innerHTML = '<div class="card empty">Tidak ada yang perlu ditindaklanjuti sekarang.</div>'; return; }
  el.innerHTML = kepala('Tindak lanjut', B.tl.length + ' hal untuk ditindaklanjuti. Gunakan untuk menyapa dengan hangat, bukan untuk membandingkan.') + '<section class="card sec">' + B.tl.map((it, i) => {
    const j = JN[it.jenis] || [it.jenis, ''];
    return '<div class="bi" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>' + esc(it.namaAnak) + '</b>' + (it.praktekNama ? '<small style="color:#334155">' + esc(it.praktekNama) + '</small>' : '') + '<small>' + esc(it.keterangan) + '</small></div><span class="bg ' + j[1] + '" style="height:fit-content">' + j[0] + '</span></div><div class="ba" id="ta' + i + '" style="margin-top:8px">' + aksiTl(it, i) + '</div></div>';
  }).join('') + '</section>';
}
async function tlA(i, a, b) {
  const it = B.tl[i], ok = async (fn, msg) => { b.disabled = true; try { await fn(); B.tl.splice(i, 1); toast(msg); gTl(); } catch (e) { b.disabled = false; gagal(e); } };
  if (a === 'hubungi') { $('ta' + i).innerHTML = '<span class="d" style="align-self:center">Sembunyikan selama:</span><button class="p" onclick="tlH(' + i + ',14,this)">14 hari</button><button class="p" onclick="tlH(' + i + ',30,this)">30 hari</button><button onclick="gTl()">Batal</button>'; return; }
  if (a === 'kebiasaan') { if (!kon(b, 'Ketuk lagi untuk sahkan')) return; return ok(() => apiCall('tandaiSudahKebiasaan', it.catatanId), 'Tercatat sebagai Kebiasaan Tetap'); }
  if (a === 'terjaga') return ok(() => apiCall('cekBerkala', it.catatanId, 'Terjaga'), 'Cek berkala dicatat: masih terjaga');
  if (!kon(b, 'Ketuk lagi: kembali ke Berjalan')) return;
  return ok(() => apiCall('cekBerkala', it.catatanId, 'KembaliBerjalan'), 'Dikembalikan ke status Berjalan');
}
async function tlH(i, h, b) {
  const it = B.tl[i]; b.disabled = true;
  try { await apiCall('sembunyikanTindakLanjut', it.jenis, it.anakId, it.catatanId, h); B.tl.splice(i, 1); toast('Disembunyikan ' + h + ' hari'); gTl(); } catch (e) { b.disabled = false; gagal(e); }
}

// ---- Apresiasi (usulan dengan izin orang tua) ----
async function aprK() {
  const el = $('isi'); el.innerHTML = skel(2);
  try {
    const d = await apiCall('getApresiasiKelompok'); B.apr = d;
    el.innerHTML = kepala('Apresiasi', 'Yang tampil ke Desa/Daerah hanya: nama anak, Kelompok, karakter, dan tanggal. Wajib atas izin orang tua; izin bisa ditarik kapan saja.') +
      '<section class="card sec"><div class="sh"><h3>Bisa diusulkan</h3><p>Kebiasaan Tetap baru (90 hari terakhir)</p></div>' +
      (d.kandidat.length ? d.kandidat.map((k, i) => '<div class="bi" style="display:block"><b>' + esc(k.namaAnak) + '</b><small style="color:#334155">' + esc(k.karakterNama) + ' &middot; ' + esc(k.praktekNama) + '</small><small>Kebiasaan Tetap sejak ' + esc(k.tanggal) + '</small><label class="hab" style="margin:8px 0;font-size:12px;color:#334155"><input type="checkbox" onchange="$(\'ub' + i + '\').disabled=!this.checked"><span>Orang tua sudah mengizinkan nama anak ditampilkan kepada BK Desa dan BK Daerah.</span></label><div class="ba"><button class="p" id="ub' + i + '" disabled onclick="usul(' + i + ',this)">Usulkan untuk diapresiasi</button></div></div>').join('') : '<div class="empty">Belum ada yang bisa diusulkan.</div>') + '</section>' +
      '<section class="card sec"><div class="sh"><h3>Sudah diusulkan</h3></div>' + (d.terdaftar.length ? d.terdaftar.map((t, i) => '<div class="bi"><div><b>' + esc(t.namaAnak) + '</b><small>' + esc(t.karakterNama) + ' &middot; ' + esc(t.tanggal) + '</small>' + (t.sudahDiapresiasi ? '<span class="bg">Sudah diapresiasi</span>' : '') + '</div><div class="ba"><button class="x" onclick="tarik(' + i + ',this)">Tarik persetujuan</button></div></div>').join('') : '<div class="empty">Belum ada anak yang diusulkan.</div>') + '</section>';
  } catch (e) { galat(el, e); }
}
async function usul(i, b) { b.disabled = true; try { await apiCall('daftarkanApresiasi', B.apr.kandidat[i].catatanId, true); toast('Diusulkan untuk diapresiasi'); aprK(); } catch (e) { b.disabled = false; gagal(e); } }
async function tarik(i, b) { if (!kon(b, 'Ketuk lagi: hapus')) return; b.disabled = true; try { await apiCall('tarikApresiasi', B.apr.terdaftar[i].id); toast('Persetujuan ditarik, data dihapus'); aprK(); } catch (e) { b.disabled = false; gagal(e); } }

// ---- Ringkasan Kelompok ----
async function ringK() {
  const el = $('isi'); el.innerHTML = skel(2);
  try {
    const r = await apiCall('getRingkasanKelompokBK'), st = (l, v) => '<div class="card stat"><div class="l">' + l + '</div><div class="v">' + v + '</div></div>';
    el.innerHTML = kepala('Ringkasan Kelompok', 'Angka saja. Anak yang lama tidak mencatat dan jadwal cek berkala ada di tab Tindak lanjut.') + '<div class="stats">' + st('Keluarga', r.jumlahKeluarga) + st('Anak', r.jumlahAnak) + st('Menunggu sah', r.jumlahAntrian) + st('Belum mulai', r.belumMulai) + '</div>' +
      (r.belumMulai > 0 ? '<p class="d">' + r.belumMulai + ' anak belum memilih praktek karakter. Ingatkan orang tuanya untuk mulai memilih dari layar mereka.</p>' : '');
  } catch (e) { galat(el, e); }
}

// ---- + Keluarga (keluarga lalu anak) ----
function keluarga() {
  if (B.kel) return formAnak();
  $('isi').innerHTML = kepala('Daftarkan keluarga baru', 'Orang tua masuk memakai akun Google dengan email yang Anda daftarkan di sini.') + '<div class="card fl" style="padding:18px;max-width:520px"><label>Nama kepala keluarga</label><input id="kk"><label>Email wali 1 (akun Google)</label><input id="e1" inputmode="email" autocapitalize="none" placeholder="nama@gmail.com"><label>Hubungan wali 1 dengan anak</label><input id="h1" placeholder="mis. Ibu, Ayah, Wali"><label>Email wali 2 (opsional)</label><input id="e2" inputmode="email" autocapitalize="none"><label>Hubungan wali 2 dengan anak</label><input id="h2"><button class="go" onclick="simpanKel(this)">Daftarkan keluarga</button></div>';
}
async function simpanKel(b) {
  const v = id => $(id).value.trim(), re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/, e1 = v('e1').toLowerCase(), e2 = v('e2').toLowerCase();
  if (!v('kk')) return toast('Nama kepala keluarga wajib diisi.', true);
  if (!re.test(e1)) return toast('Masukkan email wali 1 yang valid.', true);
  if (e2 && (!re.test(e2) || e2 === e1)) return toast('Email wali 2 tidak valid atau sama dengan wali 1.', true);
  b.disabled = true;
  try { const h = await apiCall('daftarkanKeluarga', v('kk'), e1, v('h1'), e2, v('h2')); B.kel = { id: h.keluargaId, nama: v('kk'), anak: [] }; toast('Keluarga terdaftar. Sekarang tambahkan anaknya.'); formAnak(); } catch (e) { b.disabled = false; gagal(e); }
}
function formAnak() {
  const k = B.kel, hi = new Date().toISOString().slice(0, 10);
  $('isi').innerHTML = kepala('Keluarga ' + esc(k.nama), 'Tambahkan anak-anaknya.') + '<div class="card fl" style="padding:18px;max-width:520px">' + (k.anak.length ? '<p class="d" style="margin-bottom:10px">Sudah ditambahkan: ' + k.anak.map(esc).join(', ') + '</p>' : '') + '<label>Nama anak</label><input id="an"><label>Tanggal lahir</label><input id="tgl" type="date" max="' + hi + '"><p class="d" style="margin:-6px 0 10px">Dipakai untuk menyesuaikan praktek dengan usia. Boleh dikosongkan, tapi sebaiknya diisi.</p><label>Jenis kelamin</label><select id="jk"><option value="">(tidak diisi)</option><option value="L">Laki-laki</option><option value="P">Perempuan</option></select><label>Anak ke-</label><input id="ak" type="number" min="1" inputmode="numeric"><label>Jumlah saudara</label><input id="js" type="number" min="1" inputmode="numeric"><button class="go" onclick="simpanAnak(this)">Tambahkan anak</button><button class="lk" style="color:#475569" onclick="B.kel=null;keluarga()">Selesai &mdash; daftarkan keluarga lain</button></div>';
}
async function simpanAnak(b) {
  const nm = $('an').value.trim(), ak = $('ak').value, js = $('js').value;
  if (!nm) return toast('Nama anak wajib diisi.', true);
  if (ak && js && +ak > +js) return toast('Urutan anak tidak boleh lebih besar dari jumlah saudara.', true);
  b.disabled = true;
  try { await apiCall('daftarkanAnak', B.kel.id, nm, $('tgl').value, $('jk').value, ak, js); B.kel.anak.push(nm); toast('"' + nm + '" ditambahkan.'); formAnak(); } catch (e) { b.disabled = false; gagal(e); }
}

// ---- Akun (ganti password sendiri, semua BK) ----
function akun() {
  $('isi').innerHTML = kepala('Akun', 'Ganti password Anda.') + '<div class="card fl" style="padding:18px;max-width:520px"><label>Password lama</label><input id="pl" type="password" autocomplete="current-password"><label>Password baru (min. 8 karakter)</label><input id="pn" type="password" autocomplete="new-password"><label>Ulangi password baru</label><input id="pu" type="password" autocomplete="new-password"><button class="go" onclick="simpanPw(this)">Simpan password</button></div>';
}
async function simpanPw(b) {
  const l = $('pl').value, n = $('pn').value;
  if (!l) return toast('Password lama wajib diisi.', true);
  if (n.length < 8) return toast('Password baru minimal 8 karakter.', true);
  if (n !== $('pu').value) return toast('Ulangi password tidak sama.', true);
  b.disabled = true;
  try { await apiCall('gantiPasswordSaya', l, n); toast('Password berhasil diganti'); akun(); } catch (e) { b.disabled = false; gagal(e); }
}

// ============ START ============
(async function () {
  const g = new URLSearchParams(location.search).get('g');
  try {
    if (g) { history.replaceState(null, '', location.pathname); $('login').hidden = true; return mulai(await post({ action: 'loginGoogle', token: g })); }
    const t = sessionStorage.getItem('j29');
    if (t) { const i = await post({ action: 'sesi', token: t }); const nm = i.role.nama || (i.role.tipe === 'ortu' ? 'Orang Tua' : 'Pengurus BK'); $('areaSesi').innerHTML = '<button class="lanjut" id="bL"></button>'; $('bL').textContent = 'Lanjutkan sebagai ' + nm + ' \u2192'; $('bL').onclick = () => mulai(i); }
  } catch (e) { $('login').hidden = false; try { sessionStorage.removeItem('j29'); } catch (x) {} if (g || !/SESI_HABIS/.test(e.message)) toast(e.message, true); }
})();
</script>
